name: ci
on: [push, pull_request]

jobs:
  cpu-tests:
    # No GPU on hosted runners: the Triton kernel is exercised through the
    # numpy interpreter (TRITON_INTERPRET=1) so every code path is still tested.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install setuptools wheel numpy triton pytest ruff   # setuptools: not bundled with Python >= 3.12; numpy: Triton interpreter
      - run: pip install -e . --no-build-isolation
        env: { FUSED_ATTN_SKIP_CUDA: "1" }
      - run: ruff check .
      - run: TRITON_INTERPRET=1 pytest -q -rfE --tb=short
      - name: type-check the KV-cache CUDA kernels without a GPU (host stub)
        run: g++ -fsyntax-only -std=c++17 -Wall -Werror -Wno-unknown-pragmas -Wno-unused-variable -x c++ -Icsrc -Icsrc/host_stub -include csrc/host_stub/cuda_host_stub.h csrc/kv_cache.cu
